<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="frontend-slides-brand-status" content="draft">
  <meta name="frontend-slides-deck-id" content="runtime-validation-fixture">
  <title>Validation fixture</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    .deck-viewport { position: fixed; inset: 0; }
    .deck-stage { position: absolute; left: 0; top: 0; width: 750px; height: 1320px; }
    .slide { position: absolute; inset: 0; width: 750px; height: 1320px; visibility: hidden; opacity: 0; }
    .slide.active, .slide.visible { visibility: visible; opacity: 1; }
    .slide-content { position: relative; height: 100%; padding: 120px 60px 60px; }
    h1 { margin: 0; font: 700 75px/1 sans-serif; letter-spacing: -0.05em; }
    p { margin: 45px 0 0; width: 560px; font: 400 30px/1 sans-serif; letter-spacing: -0.05em; }
  </style>
</head>
<body data-tone-mode="light" data-export-filename="runtime-validation-fixture.html">
  <div class="deck-viewport">
    <main class="deck-stage" id="deckStage">
      <section class="slide active visible" data-slide-kind="kv" data-slide-height="1320">
        <div class="slide-content">
          <h1 data-copy-id="fixture-title" data-editable="text" data-edit-id="fixture-title">固定品牌演示</h1>
          <p data-copy-id="fixture-body" data-editable="text" data-edit-id="fixture-body">这是用于验证固定 750px 宽度、KV 高度与浏览器渲染流程的最小样例。</p>
        </div>
      </section>
      <section class="slide" data-slide-kind="content" data-slide-height="1320">
        <div class="slide-content">
          <h1 data-copy-id="fixture-title-2" data-editable="text" data-edit-id="fixture-title-2">第二张切片</h1>
          <p data-copy-id="fixture-body-2" data-editable="text" data-edit-id="fixture-body-2">用于验证固定画布和导航功能。</p>
        </div>
      </section>
    </main>
  </div>
  <div class="deck-controls" aria-label="演示控制"></div>
</body>
</html>
